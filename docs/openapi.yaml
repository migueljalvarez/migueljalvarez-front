openapi: 3.1.0
info:
  title: API de migueljalvarez.com
  version: 0.1.0
  description: |
    Contrato actual de los endpoints `/api/*` implementados en Nitro (Nuxt). El contenido público (portafolio, redes,
    políticas) lo sirve la API propia (`../migueljalvarez-api`) con respaldo en el código; los endpoints del panel
    viven en el repositorio de la API. Es la referencia que
    debe cumplir el futuro backend Nest + Postgres: mientras el contrato no cambie, el frontend solo
    necesita cambiar la URL base.

    Estado: **documenta lo que existe hoy** (nov-2026). Los módulos del panel (leads, testimonios por
    enlace, proyectos, equipo, pagos) se agregarán en este archivo cuando se diseñen. Los testimonios
    públicos se incorporarán cuando exista el primer testimonio real aprobado.

    Convenciones:
    - Errores: JSON de Nitro/H3 `{ statusCode, statusMessage, message }` (ver `Error`).
    - Textos de error y de interfaz en español.
    - Los endpoints públicos de lectura usan caché (`maxAge` 1800 s con stale-while-revalidate).
    - Montos futuros: siempre USD; la TRM se guarda por transacción.
servers:
  - url: http://localhost:3000
    description: Desarrollo local (el puerto puede cambiar con PORT)
  - url: https://www.migueljalvarez.com
    description: Producción (aún no publicada)
tags:
  - name: Público
    description: Lectura de contenido del sitio
  - name: Contacto
  - name: Testimonios
    description: Enlace único del cliente y envío del correo desde el panel
  - name: Admin
    description: Panel privado /admin (proxy hacia la API propia con contraseña + TOTP)
  - name: SEO
paths:
  /api/portfolio:
    get:
      tags: [Público]
      summary: Lista los proyectos del portafolio
      description: |
        Fuente principal: la API de contenido (migueljalvarez-api, `GET /api/portfolio`), gestionada desde
        el panel. Si la API no está configurada (`NUXT_API_BASE_URL`), no responde o no tiene nada
        publicado, se usa el contenido de respaldo del código (productos propios y trabajos reales).
        En desarrollo el respaldo incluye proyectos de ejemplo (marcados con `sample`); nunca en producción.
        Caché corta (60 s, stale-while-revalidate).
      operationId: listPortfolio
      responses:
        '200':
          description: Lista de proyectos (destacados primero)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortfolioProject'
  /api/portfolio/{slug}:
    get:
      tags: [Público]
      summary: Detalle de un proyecto por slug
      operationId: getPortfolioProject
      parameters:
        - name: slug
          in: path
          required: true
          description: Slug del proyecto
          schema:
            type: string
      responses:
        '200':
          description: Proyecto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioProject'
        '404':
          description: No existe o es un producto en desarrollo (sin ficha pública)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/legal:
    get:
      tags: [Público]
      summary: Titular legal del sitio
      description: |
        Nombre, tipo y número de documento, correo y ciudad del titular, leídos de las variables
        `NUXT_PUBLIC_LEGAL_*` en ejecución. Solo lo piden Términos y Privacidad; no viaja en el HTML de las
        demás páginas. Cada dato sin configurar llega como cadena vacía. Caché de 5 minutos.
      operationId: getLegalHolder
      responses:
        '200':
          description: Titular normalizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  idType: { type: string, enum: ['', CC, NIT] }
                  idNumber: { type: string }
                  email: { type: string }
                  city: { type: string }
  /api/social-links:
    get:
      tags: [Público]
      summary: Redes sociales del sitio
      description: |
        API de contenido (`GET /api/social-links`, solo las visibles) con respaldo en `MY_SOCIAL_MEDIA`.
        Caché corta (60 s, stale-while-revalidate).
      operationId: listSocialLinks
      responses:
        '200':
          description: Redes ordenadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SocialLink'
  /api/about:
    get:
      tags: [Público]
      summary: Sección "Sobre mí" de la home
      description: |
        API de contenido (`GET /api/about`, solo si está publicada y con imágenes) con respaldo en
        `ABOUT_FALLBACK` (`constants/common`): se usa el respaldo si la API no está configurada, no
        responde (2 s), da 404 o devuelve algo inválido, así que siempre responde 200. Los opcionales
        vacíos se omiten y las imágenes se recortan a 3. Caché corta (60 s, stale-while-revalidate;
        sin caché en desarrollo).
      operationId: getAbout
      responses:
        '200':
          description: Contenido de la sección
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutContent'
  /api/policies:
    get:
      tags: [Público]
      summary: Acuerdos de trabajo (/como-trabajo)
      description: |
        API de contenido (`GET /api/policies`, solo las públicas) con respaldo en `data/work.ts`.
        Caché corta (60 s, stale-while-revalidate).
      operationId: listPolicies
      responses:
        '200':
          description: Políticas ordenadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyBlock'
  /api/contact:
    post:
      tags: [Contacto]
      summary: Envía un mensaje desde el formulario de contacto
      description: |
        Valida (exige `consent: true`, autorización previa y expresa según la Ley 1581), aplica límite de
        5 intentos por IP cada 10 minutos y captura el mensaje por dos canales: primero envía el correo
        (Resend) y después guarda el lead en la API de contenido (`POST /api/intake/leads`, con la clave
        compartida `NUXT_INTAKE_API_KEY`), con hasta 3 reintentos ante fallos transitorios. La API es
        idempotente, de modo que un reintento no duplica el lead. La versión de la política de
        privacidad la fija el servidor (no el navegador).

        Responde 200 si AL MENOS UNO de los dos canales capturó el mensaje; solo si fallan ambos
        responde 500. Si la API no está configurada, solo se envía el correo.
        Si el campo trampa `website` viene con texto, responde 200 sin enviar (bot).
      operationId: sendContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactRequest'
      responses:
        '200':
          description: Mensaje enviado (o descartado silenciosamente si es un bot)
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                    const: true
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Demasiados intentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: No se pudo enviar el correo o falta configuración
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/testimonial/{token}:
    get:
      tags: [Testimonios]
      summary: Abre el formulario de testimonio con el enlace único del correo
      description: |
        Enlace `/testimonio/<token>` (noindex, sin referrer). El sitio llama a la API desde Nitro
        (`GET /api/testimonials/requests/{token}`) y reenvía la IP real del visitante para el límite de
        fallos. Un token mal formado nunca llega a la API. Token inexistente, vencido o ya usado: el MISMO
        404 genérico «Enlace no válido o vencido». Respuesta `Cache-Control: no-store`; el token no se
        escribe en logs.
      operationId: openTestimonialForm
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{43}$'
      responses:
        '200':
          description: Datos mínimos para mostrar el formulario (sin correo ni identificadores)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTestimonialForm'
        '404':
          description: Enlace no válido o vencido (mismo mensaje en todos los casos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Demasiados intentos fallidos desde esta IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: La API no está configurada o no responde
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Testimonios]
      summary: El cliente envía su testimonio (una sola vez por enlace)
      description: |
        Valida en el servidor (texto 10-3000 caracteres sin `<` ni `>`, `consentPublish: true` obligatorio
        según la Ley 1581, cuerpo máximo 16 KB) y reenvía a la API, que vuelve a validar y deja la solicitud
        `respondida` pendiente de aprobación (no aparece en la web hasta que el administrador la apruebe).
        Responde 204 sin cuerpo y `Cache-Control: no-store`.
      operationId: submitTestimonial
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{43}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestimonialSubmission'
      responses:
        '204':
          description: Recibido; queda pendiente de aprobación
        '400':
          description: Validación (texto, campos extra o consentimiento ausente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Enlace no válido, vencido o ya usado (mismo mensaje genérico)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Cuerpo demasiado grande
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Demasiados intentos fallidos desde esta IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: La API no está configurada o no responde
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/testimonial-requests/send:
    post:
      tags: [Testimonios]
      summary: Crea o renueva una solicitud de testimonio y envía el correo con el enlace único
      description: |
        Archivo específico: tiene prioridad sobre el proxy `/api/admin/{...path}`. Pasos:

        1. Exige `Origin` del propio sitio y una sesión de administrador válida (se comprueba en la API con la
           cookie `admin_session`); sin sesión, 401.
        2. Límite de 10 envíos cada 10 minutos por IP (en memoria).
        3. Crea la solicitud (`mode: create`) o la renueva (`mode: renew`, 409 si ya fue respondida) en la API,
           que entrega el token en claro una sola vez.
        4. Arma el enlace con `NUXT_PUBLIC_BASE_URL` (`/testimonio/<token>`; nunca con datos de la petición).
        5. Envía el correo al cliente con Resend (remitente `MAIL_FROM`; HTML escapado, texto plano alterno,
           sin pixeles de seguimiento).

        La respuesta NUNCA lleva el token en `request`. Si el correo salió (`mail: sent`) no hay `link`; si
        no (`not-configured` o `failed`) llega `link` una sola vez para copiarlo y enviarlo por otro canal.
        En desarrollo no se envía correo real salvo que `TESTIMONIAL_MAIL_DEV=true`. El token y la clave de
        Resend no se escriben en logs. Respuesta `Cache-Control: no-store`.
      operationId: sendTestimonialRequest
      security:
        - adminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestimonialSendRequest'
      responses:
        '200':
          description: Solicitud creada o renovada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestimonialSendResponse'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin sesión válida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origen no permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: La solicitud a renovar no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El cliente indicado no existe o la solicitud ya fue respondida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Cuerpo demasiado grande
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Demasiados envíos seguidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Falta configurar la URL pública del sitio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: La API no está configurada o no responde
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/{...path}:
    x-proxy: true
    get:
      tags: [Admin]
      summary: Proxy del panel hacia la API (cualquier método permitido)
      description: |
        El panel nunca llama a la API desde el navegador: todo `/api/admin/**` del sitio se reenvía a
        `/api/admin/**` de la API (migueljalvarez-api), que resuelve la autenticación y los módulos
        (contrato en `docs/openapi-panel.yaml` del repositorio de la API). Métodos: GET, POST, PATCH,
        PUT y DELETE.

        - La sesión es la cookie `admin_session` (HttpOnly) que emite la API tras contraseña + TOTP;
          el proxy solo reenvía esa cookie, la IP real (`x-client-ip`) y, si hace falta, las credenciales
          de servicio de Cloudflare Access (nunca salen del servidor).
        - Solo se aceptan segmentos de ruta `[A-Za-z0-9._~-]`: no puede salirse de `/api/admin/`.
        - Las operaciones que modifican datos exigen que `Origin` (si viene) sea el del propio sitio.
        - Cuerpo máximo 1 MB (JSON). Única excepción: `POST /api/admin/media` acepta `multipart/form-data`
          (subida de imágenes, campo `file` y `folder`) de hasta 5 MB; se reenvía como bytes sin tocar,
          exige `Content-Length` (411 si falta; 413 si supera el tope) y otro destino con multipart da 415.
          `DELETE /api/admin/media?key=<carpeta>/<uuid>.webp` elimina una imagen.
        - No sigue redirecciones; respuestas `Cache-Control: no-store`.
        - Sin API configurada (`NUXT_API_BASE_URL`) o caída: 503 con `{ statusCode, statusMessage, message }`.
      operationId: adminProxy
      parameters:
        - name: path
          in: path
          required: true
          description: Ruta bajo /api/admin de la API (p. ej. `leads/{id}`, `login/totp`, `session`)
          schema:
            type: string
      responses:
        '200':
          description: Respuesta de la API tal cual
        '204':
          description: Sin contenido (login/totp, logout, eliminaciones)
        '401':
          description: Sin sesión válida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origen no permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: El panel no está conectado a la API o la API no responde
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /robots.txt:
    get:
      tags: [SEO]
      summary: robots.txt dinámico
      description: Bloquea todo si la URL base es local; si no, bloquea rutas privadas y enlaza el sitemap.
      operationId: robots
      responses:
        '200':
          description: Texto plano
          content:
            text/plain:
              schema:
                type: string
  /sitemap.xml:
    get:
      tags: [SEO]
      summary: Sitemap dinámico
      description: Home, cómo trabajo, portafolio y fichas publicadas (excluye proyectos en desarrollo).
      operationId: sitemap
      responses:
        '200':
          description: XML
          content:
            application/xml:
              schema:
                type: string
components:
  securitySchemes:
    adminCookie:
      type: apiKey
      in: cookie
      name: admin_session
      description: Cookie HttpOnly emitida por la API tras contraseña + TOTP (`/api/admin/login` y `/api/admin/login/totp`).
  schemas:
    Error:
      type: object
      properties:
        statusCode:
          type: integer
        statusMessage:
          type: string
        message:
          type: string
    ProjectImage:
      type: object
      required: [src, alt]
      properties:
        src:
          type: string
          description: Ruta bajo /public (p. ej. /projects/mi-comodoro/01-pantalla.webp), 1600x900 WebP <=150 KB
        alt:
          type: string
        caption:
          type: string
    ProjectHighlight:
      type: object
      required: [value, label]
      properties:
        value:
          type: string
        label:
          type: string
    SocialLink:
      type: object
      required: [name, link, icon]
      properties:
        name:
          type: string
        link:
          type: string
          description: 'https:// o mailto:'
        icon:
          type: string
          description: 'Icono prefijo:nombre (p. ej. mdi:github)'
        isHovered:
          type: boolean
          description: Estado local de la interfaz (siempre false al llegar)
    AboutContent:
      type: object
      required: [eyebrow, heading, intro, stats, tools, images]
      properties:
        eyebrow:
          type: string
        heading:
          type: string
        intro:
          type: string
        role:
          type: string
          description: Cargo (opcional; el bloque se omite si falta)
        tagline:
          type: string
          description: Frase destacada (opcional)
        name:
          type: string
          description: Nombre bajo la foto (opcional)
        quote:
          type: string
        howIWork:
          type: string
        beyondWork:
          type: string
        location:
          type: string
        workMode:
          type: string
        availability:
          type: string
        stats:
          type: array
          maxItems: 4
          items:
            type: object
            required: [value, label]
            properties:
              value:
                type: string
              label:
                type: string
        tools:
          type: array
          maxItems: 12
          items:
            type: string
        interests:
          type: array
          maxItems: 6
          description: Intereses como etiquetas (opcional; se omite si está vacío)
          items:
            type: string
        cta:
          type: object
          required: [label, href]
          properties:
            label:
              type: string
            href:
              type: string
              description: 'Ruta del sitio (/#contacto) o URL https://'
        images:
          type: array
          minItems: 1
          maxItems: 4
          description: La primera es la predeterminada
          items:
            type: object
            required: [src, alt]
            properties:
              src:
                type: string
                description: 'Ruta de public/about/ (o /ma.webp en el respaldo)'
              alt:
                type: string
              width:
                type: integer
              height:
                type: integer
    PolicyBlock:
      type: object
      required: [id, title, body]
      properties:
        id:
          type: string
          description: Identificador estable para la clave de lista (no es un id de base de datos)
        title:
          type: string
        body:
          type: string
    PortfolioProject:
      type: object
      description: Guia de contenido e imagenes en docs/portfolio-guide.md
      required: [id, title, type, portfolioType, technologies, description, urlImage]
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [client, product, practice]
        status:
          type: string
          enum: [published, in-development]
          description: Los `in-development` no tienen ficha de detalle.
        portfolioType:
          type: string
          description: Etiqueta de presentacion (p. ej. "Producto propio", "Cliente")
        description:
          type: string
          description: Resumen de 1-2 frases
        role:
          type: string
        year:
          type: string
        duration:
          type: string
        problem:
          type: string
        decision:
          type: string
        result:
          type: string
        highlights:
          type: array
          items:
            $ref: '#/components/schemas/ProjectHighlight'
        scope:
          type: array
          items:
            type: string
        technologies:
          type: array
          items:
            type: string
        urlImage:
          type: string
          description: Portada 1280x720 WebP <=100 KB
        ogImage:
          type: string
          description: Imagen para redes 1200x630 JPG <=100 KB
        gallery:
          type: array
          items:
            $ref: '#/components/schemas/ProjectImage'
        url:
          type: string
          description: Enlace publico del proyecto, si existe
        tags:
          type: array
          maxItems: 4
          items:
            type: string
          description: Etiquetas de la tarjeta
        audience:
          type: string
          description: A quién va dirigido (texto de la tarjeta)
        sample:
          type: boolean
          description: Dato de ejemplo (solo desarrollo, nunca en producción)
    ContactRequest:
      type: object
      required: [name, email, subject, message, consent]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        subject:
          type: string
          enum: [desarrollo, oferta, consulta, soporte, otro]
        message:
          type: string
          minLength: 1
          maxLength: 5000
        consent:
          type: boolean
          enum: [true]
          description: Autorización de tratamiento de datos (Ley 1581). Debe ser exactamente true.
        website:
          type: string
          maxLength: 200
          description: Campo trampa (honeypot). Debe enviarse vacío.
    TestimonialSubmission:
      type: object
      required: [answer, consentPublish]
      additionalProperties: false
      properties:
        answer:
          type: string
          minLength: 10
          maxLength: 3000
          description: Texto plano, sin `<` ni `>`
        authorName:
          type: string
          maxLength: 100
          description: Reemplaza el nombre de la solicitud (opcional; vacío = no se envía)
        authorRole:
          type: string
          maxLength: 120
        authorCompany:
          type: string
          maxLength: 120
        consentPublish:
          type: boolean
          enum: [true]
          description: Autorización expresa para publicar texto, nombre, cargo y empresa (Ley 1581)
    PublicTestimonialForm:
      type: object
      required: [clientName, projectName, message, expiresAt]
      properties:
        clientName:
          type: string
        projectName:
          type: string
          description: Cadena vacía si la solicitud no tiene proyecto
        message:
          type: string
          description: Mensaje personal (cadena vacía si no hay)
        expiresAt:
          type: string
          format: date-time
    TestimonialSendRequest:
      oneOf:
        - type: object
          required: [mode, clientName, email]
          properties:
            mode:
              type: string
              const: create
            clientId:
              type: string
              format: uuid
              description: Cliente existente (opcional)
            clientName:
              type: string
              minLength: 1
              maxLength: 100
            email:
              type: string
              format: email
              maxLength: 254
            projectName:
              type: string
              maxLength: 150
            message:
              type: string
              maxLength: 1000
            expiresInDays:
              type: integer
