version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      desarrollo:
        dependency-type: development
      nuxt:
        patterns:
          - 'nuxt'
          - '@nuxt/*'
    ignore:
      # @nuxt/image 2.2 exige Nuxt 4 y estree-walker 2 es necesario a propósito (ver AGENTS.md).
      - dependency-name: estree-walker
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
